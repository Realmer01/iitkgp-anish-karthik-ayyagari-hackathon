# RiskPulse runtime settings. Universe, taxonomy and stress shocks live in their own YAML files.

engine:
  tier: auto                                  # auto | full | lite  (env RISKPULSE_TIER overrides)
  sentiment_model: ProsusAI/finbert           # full tier
  embedding_model: BAAI/bge-small-en-v1.5     # full tier; shared by dedup, events and sentiment head
  batch_size: 32
  min_chars: 20
  min_words: 4
  dedup_similarity: 0.92                      # same publisher + cosine >= this -> duplicate, dropped
  story_similarity: 0.72                      # cosine >= this -> same story (corroboration)
  story_window_hours: 24

ingestion:
  poll_seconds: 120                           # live mode, per source
  request_timeout_seconds: 30
  max_retries: 3
  gdelt_min_interval_seconds: 6               # GDELT asks for <= 1 request / 5 s
  mastodon_instance: https://mastodon.social
  mastodon_tags: [stocks, stockmarket, investing, finance, economy, wallstreet]

replay:
  speed: 3600                                 # simulated seconds per wall-clock second
  batch_max: 32

demo:                                         # offline demo: precomputed signals replayed through the bus
  start: "2025-03-31T00:00:00Z"               # window around the April 2025 US tariff shock
  end: "2025-04-15T00:00:00Z"
  speed: 5400                                 # 1.5 simulated hours per second -> ~4 minutes

module_a:                                     # tactical index rebalancer
  base_weighting: capped_market_cap           # capped_market_cap | equal
  base_cap: 0.15                              # max base weight per name
  kappa: 0.8                                  # tilt strength in w_i ~ b_i * exp(kappa * s_i)
  min_weight: 0.02
  max_weight: 0.15
  max_active_weight: 0.05                     # |w_i - b_i| limit
  drift_band: 0.005                           # rebalance only if some |target - current| exceeds 50 bp
  max_turnover_per_rebalance: 0.10            # one-way
  transaction_cost_bps: 5
  half_life_hours: 12                         # EWMA decay of the per-ticker sentiment signal
  min_confidence: 0.40
  shrinkage_k0: 1.0                           # prior evidence at zero sentiment
  min_interval_seconds: 5                     # live throttle between rebalances

module_b:                                     # strategic stress tester
  default_threshold: 7.0                      # trigger when impact > threshold
  thresholds:                                 # per event type overrides
    Credit Event: 6.5
    Operational Risk: 7.5
    Legal & Regulatory: 8.0
    Merger & Acquisition: 8.5
  eligible_events: [Geopolitical, Macroeconomic, Credit Event, Operational Risk, Legal & Regulatory,
                    Merger & Acquisition]
  min_event_confidence: 0.45
  cooldown_minutes: 60                        # same scenario + story is not re-run within this window
  scale_at_threshold: 0.7                     # shock multiplier at impact 7
  scale_at_max: 1.3                           # shock multiplier at impact 10
  baseline_cet1_ratio: 0.13                   # simplified capital proxy: CET1 = 13% of baseline RWA
  cet1_minimum_ratio: 0.105                   # 4.5% CET1 + 2.5% conservation buffer + 3.5% assumed buffers

api:
  host: 127.0.0.1
  port: 8000

dashboard:
  port: 8501
  refresh_seconds: 3
